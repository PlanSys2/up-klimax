name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # up-klimax with its dependencies from PyPI: unified-planning and klimax-planner
      - name: Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pytest -e .

      - name: Test
        run: "$RUNNER_TEMP/venv/bin/python" -m pytest -q
